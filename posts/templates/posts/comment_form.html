{% extends 'base.html' %}

{% block title %}Comentar em {{ post.title }} - Portfólio de Projetos - 3D{% endblock %}

{% block content %}
<section class="form-card">
    <header class="page-header">
        <h2>Novo Comentário</h2>
        <p class="post-meta">Em: <a href="{% url 'posts:detail' post.pk %}">{{ post.title }}</a></p>
    </header>

    <form method="post" class="styled-form">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="post-actions">
            <button type="submit" class="btn btn-primary">Publicar Comentário</button>
            <a href="{% url 'posts:detail' post.pk %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
